      metadata_key:
        type: str | None
        description: Key under ``metadata["FiberPhotometry"]`` holding this interface's response-series metadata.
        optional: true
        default: null
      read_kwargs:
        type: dict | None
        description: Additional keyword arguments forwarded to ``pandas.read_csv`` to handle format quirks such as ``sep``,
          ``encoding``, ``decimal``, or ``skiprows``.
        optional: true
        default: null
      verbose:
        type: bool
        description: Whether to print status messages.
        optional: true
        default: false
    creates:
    - FiberPhotometryResponseSeries (ndx-fiber-photometry)
    - FiberPhotometryTable and devices (ndx-ophys-devices)
    conversion_options:
      stub_test:
        type: bool
        description: If True, add only the first ``stub_samples`` samples of each series for testing purposes.
        optional: true
        default: false
      stub_samples:
        type: int
        description: The number of samples to write when ``stub_test`` is True.
        optional: true
        default: 100
      always_write_timestamps:
        type: bool
        description: If True, always write an explicit timestamps array even when the series is regularly sampled.
        optional: true
        default: false
      parent_container:
        type: Literal['acquisition', 'processing/ophys']
        description: The NWBFile container to add the ``FiberPhotometryResponseSeries`` to.
        optional: true
        default: acquisition
  - name: GuppyInterface
    module: neuroconv.datainterfaces
    format: GuPPy processed fiber photometry outputs (.hdf5/.h5/.csv/.json)
    source_data:
      folder_path:
        type: DirectoryPath
        description: Path to the GuPPy output folder (the ``<session>_output_<N>`` directory containing ``storesList.csv``,
          the per-recording_site derived ``.hdf5`` files, and the ``GuPPyParamtersUsed.json`` provenance file).
      metadata_key:
        type: str | None
        description: Key under ``metadata["FiberPhotometry"]["Guppy"]`` that scopes everything this interface writes, so two
          GuPPy interfaces in one conversion do not collide.
        optional: true
        default: null
      verbose:
        type: bool
        description: Whether to print status messages, default = False.
        optional: true
        default: false
    creates:
    - 'ndx-guppy types: control fit, dF/F and z-score traces, transients, PSTHs, GuppyParameters'
    conversion_options:
      stub_test:
        type: bool
        description: If True, only a short slice of each large product is written.
        optional: true
        default: false
      always_write_timestamps:
        type: bool
        description: If True, always write the explicit ``timestamps`` vector on each derived trace instead of the ``starting_time``
          + ``rate`` representation used when the timestamps are regularly sampled.
        optional: true
        default: false
    notes: Processed GuPPy products only; convert the raw acquisition with the acquisition system's interface
behavior:
  pose_estimation:
  - name: DeepLabCutInterface
    module: neuroconv.datainterfaces
    format: DeepLabCut output (.h5 or .csv)
    source_data:
      file_path:
        type: FilePath
        description: Path to the file output by DeepLabCut (.h5 or .csv).
      config_file_path:
        type: FilePath | None
        description: Path to the DeepLabCut .yml config file.
        optional: true
        default: null
      subject_name:
        type: str
        description: The subject name to be used in the metadata.
        optional: true
        default: ind1
      pose_estimation_metadata_key:
        type: str | None
        description: Deprecated.
        optional: true
        default: null
      verbose:
        type: bool
        description: Controls verbosity of the conversion process.
        optional: true
        default: false
      metadata_key:
        type: str | None
        description: The registry key under which this interface's metadata is stored in the dict-based format.
        optional: true
        default: null
      sampling_frequency:
        type: float | None
        description: The frame rate of the video the pose was estimated from, in Hz.
        optional: true
        default: null
    creates:
    - PoseEstimation (ndx-pose, in behavior processing module)
    - PoseEstimationSeries (per bodypart)
    - Skeleton
    conversion_options: {}
  - name: SLEAPInterface
    module: neuroconv.datainterfaces
    format: SLEAP output (.slp)
    source_data:
      file_path:
        type: FilePath
        description: Path to the .slp file (the output of sleap)
      video_file_path:
        type: FilePath | None
        description: The file path of the video for extracting timestamps.
        optional: true
        default: null
      verbose:
        type: bool
        description: controls verbosity. ``True`` by default.
        optional: true
        default: false
      frames_per_second:
        type: float | None
        description: The frames per second (fps) or sampling rate of the video.
        optional: true
        default: null
      track_name:
        type: str | None
        description: Which tracked individual to write.
        optional: true
        default: null
      video_name:
        type: str | None
        description: Which recording to write, as the stem of its path.
        optional: true
        default: null
      metadata_key:
        type: str | None
        description: Key addressing this interface's entries in the dict-based metadata.
        optional: true
        default: null
    creates:
    - PoseEstimation (ndx-pose, in behavior processing module)
    - PoseEstimationSeries (per bodypart)
    - Skeleton
    conversion_options: {}
  - name: LightningPoseDataInterface
    module: neuroconv.datainterfaces
    format: Lightning Pose predictions (.csv + .mp4)
    source_data:
      file_path:
        type: FilePath
        description: Path to the .csv file that contains the predictions from Lightning Pose.
      original_video_file_path:
        type: FilePath
        description: Path to the original video file (.mp4).
      labeled_video_file_path:
        type: FilePath | None
        description: Path to the labeled video file (.mp4).
        optional: true
        default: null
      verbose:
        type: bool
        description: controls verbosity. ``True`` by default.
        optional: true
        default: false
      metadata_key:
        type: str
        description: 'Key addressing this interface''s entries in the dict-based metadata: the container under ``metadata["Pose"]["PoseEstimations"]``,
          the skeleton under ``metadata["Pose"]["Skeletons"]`` and the camera under ``metadata["Devices"]``.'
        optional: true
        default: lightning_pose
    creates:
    - PoseEstimation (ndx-pose, in behavior processing module)
    - PoseEstimationSeries (per bodypart)
    conversion_options:
      reference_frame:
        type: str | None
        description: Deprecated.
        optional: true
        default: null
      confidence_definition:
        type: str | None
        description: Deprecated.
        optional: true
        default: null
      stub_test:
        type: bool | None
        optional: true
        default: false
  tracking:
  - name: FicTracDataInterface
    module: neuroconv.datainterfaces
    format: FicTrac (.dat)
    source_data:
      file_path:
        type: FilePath
        description: Path to the .dat file (the output of fictrac)
      radius:
        type: float | None
        description: The radius of the ball in meters.
        optional: true
        default: null
      configuration_file_path:
        type: FilePath | None
        description: Path to the .txt file with the configuration metadata.
        optional: true
        default: null
      verbose:
        type: bool
        description: controls verbosity. ``True`` by default.
        optional: true
        default: false
    creates:
    - Position (multiple SpatialSeries in behavior processing module)
    - SpatialSeries for rotation, heading, speed, movement
    conversion_options: {}
  - name: NeuralynxNvtInterface
    module: neuroconv.datainterfaces
    format: Neuralynx position tracking (.nvt)
    source_data:
      file_path:
        type: FilePath
        description: Path to the .nvt file
      verbose:
        type: bool
        description: controls verbosity.
        optional: true
        default: false
    creates:
    - Position (SpatialSeries in behavior processing module)
    - CompassDirection (SpatialSeries for head angle)
    conversion_options:
      add_position:
        type: bool
        optional: true
        default: true
      add_angle:
        type: bool | None
        description: If None, write angle as long as it is not all 0s
