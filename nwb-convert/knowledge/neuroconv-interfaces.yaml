        default: null
  video:
  - name: ExternalVideoInterface
    module: neuroconv.datainterfaces
    format: Video files (.mp4/.avi/.wmv/.mov/.flv/.mkv) - external reference
    source_data:
      file_paths:
        type: list[FilePath]
        description: Many video storage formats segment a sequence of videos over the course of the experiment.
      verbose:
        type: bool
        description: If True, display verbose output.
        optional: true
        default: false
      metadata_key:
        type: str | None
        description: Snake_case key that identifies this video's entry under ``metadata["Behavior"]["ExternalVideos"]`` and
          is used for cross-component linking.
        optional: true
        default: null
      video_name:
        type: str | None
        description: Convenience for setting the ImageSeries ``name`` (the entry's ``name`` field) without editing the metadata
          dict.
        optional: true
        default: null
    creates:
    - ImageSeries (with external_file reference)
    - Device (camera)
    conversion_options:
      starting_frames:
        type: list[int] | None
        description: List of start frames for each video written using external mode.
        optional: true
        default: null
      parent_container:
        type: Literal['acquisition', 'processing/behavior']
        description: The container where the ImageSeries is added, default is nwbfile.acquisition.
        optional: true
        default: acquisition
      module_description:
        type: str
        description: If parent_container is 'processing/behavior', and the module does not exist, it will be created with
          this description.
        optional: true
        default: processed behavioral data
      always_write_timestamps:
        type: bool
        description: Set to True to always write timestamps.
        optional: true
        default: false
    notes: Videos stored as external references (file paths), not embedded in NWB
  - name: InternalVideoInterface
    module: neuroconv.datainterfaces
    format: Video file (.mp4/.avi/.wmv/.mov/.flv/.mkv) - embedded
    source_data:
      file_path:
        type: FilePath
        description: The path to the video file.
      verbose:
        type: bool
        description: If True, display verbose output.
        optional: true
        default: false
      metadata_key:
        type: str | None
        description: Snake_case key that identifies this video's entry under ``metadata["Behavior"]["InternalVideos"]`` and
          is used for cross-component linking.
        optional: true
        default: null
      video_name:
        type: str | None
        description: Convenience for setting the ImageSeries ``name`` (the entry's ``name`` field) without editing the metadata
          dict.
        optional: true
        default: null
    creates:
    - ImageSeries (with data stored internally)
    - Device (camera)
    conversion_options:
      stub_test:
        type: bool
        description: If ``True``, truncates the write operation for fast testing.
        optional: true
        default: false
      buffer_data:
        type: bool
        description: If True, uses a DataChunkIterator to read and write the video, reducing overhead RAM usage at the cost
          of reduced conversion speed (compared to loading video entirely into RAM as an array).
        optional: true
        default: true
      iterator_options:
        type: dict | None
        description: Options for controlling iterative write when buffer_data=True.
        optional: true
        default: null
      parent_container:
        type: Literal['acquisition', 'processing/behavior']
        description: The container where the ImageSeries is added, default is nwbfile.acquisition.
        optional: true
        default: acquisition
      module_description:
        type: str
        description: If parent_container is 'processing/behavior', and the module does not exist, it will be created with
          this description.
        optional: true
        default: processed behavioral data
      always_write_timestamps:
        type: bool
        description: Set to True to always write timestamps.
        optional: true
        default: false
    notes: Video data embedded directly in NWB file
  - name: MiniscopeBehaviorInterface
    module: neuroconv.datainterfaces
    format: Miniscope behavior camera (.avi + metaData.json)
    source_data:
      folder_path:
        type: DirectoryPath
        description: The path that points to the main Miniscope folder.
      verbose:
        type: bool
        description: If True, enables verbose mode for detailed logging, by default False.
        optional: true
        default: false
    creates:
    - ImageSeries (BehavCamImageSeries with external file)
    - Device (Miniscope BehavCam, via ndx-miniscope)
    conversion_options: {}
  orientation:
  - name: MiniscopeHeadOrientationInterface
    module: neuroconv.datainterfaces
    format: Miniscope head orientation (headOrientation.csv from BNO055 IMU)
    source_data:
      file_path:
        type: FilePath
        description: 'Path to headOrientation.csv file with columns: Time Stamp (ms), qw, qx, qy, qz'
      metadata_key:
        type: str
        description: The key in metadata['TimeSeries'] to use for this interface.
        optional: true
        default: TimeSeriesMiniscopeHeadOrientation
      verbose:
        type: bool
        description: If True, enables verbose mode for detailed logging, by default False.
        optional: true
        default: false
    creates:
    - TimeSeries (quaternion data in behavior processing module)
    conversion_options:
      always_write_timestamps:
        type: bool
        description: Set to True to always write timestamps.
        optional: true
        default: false
  audio:
  - name: AudioInterface
    module: neuroconv.datainterfaces
    format: WAV audio (.wav)
    source_data:
      file_paths:
        type: list[FilePath]
        description: The file paths to the audio recordings in sorted, consecutive order.
      verbose:
        type: bool
        optional: true
        default: false
    creates:
    - AcousticWaveformSeries (ndx-sound, in acquisition)
    conversion_options:
      stub_test:
        type: bool
        optional: true
        default: false
      stub_frames:
        type: int
        optional: true
        default: 1000
      parent_container:
        type: Literal['stimulus', 'acquisition']
        description: The acoustic waveform series can be added to the NWB file either as "stimulus" or as "acquisition".
        optional: true
        default: stimulus
      iterator_options:
        type: dict | None
        description: Dictionary of options for the SliceableDataChunkIterator.
        optional: true
        default: null
      write_as:
        type: Literal['stimulus', 'acquisition'] | None
        description: Deprecated.
        optional: true
        default: null
  operant:
  - name: MedPCInterface
    module: neuroconv.datainterfaces
    format: MedPC output (.txt)
    source_data:
      file_path:
        type: FilePath
        description: Path to the MedPC file.
      session_conditions:
        type: dict
        description: The conditions that define the session.
      start_variable:
        type: str
        description: The name of the variable that starts the session (ex. 'Start Date').
      metadata_medpc_name_to_info_dict:
        type: dict
        description: 'A dictionary mapping the names of the desired variables in the MedPC file to an info dictionary with
          the names of the variables in the metadata and whether or not they are arrays. ex. {"Start Date": {"name": "start_date",
          "is_array": False}}'
      aligned_timestamp_names:
        type: list[str] | None
        description: The names of the variables that are externally aligned timestamps, which should be retrieved from self.timestamps_dict
          instead of the MedPC output file.
        optional: true
        default: null
      verbose:
        type: bool
        description: Whether to print verbose output, by default True
        optional: true
        default: false
    creates:
    - Events (ndx-events, in acquisition)
    - BehavioralEpochs (IntervalSeries)
    conversion_options: {}
    deprecated: Use MedPCArrayEventsInterface or MedPCPackedEventsInterface (see events), which write core EventsTable objects
  behavioral_segmentation:
  - name: MoseqKeyPointsInterface
    module: neuroconv.datainterfaces
    format: keypoint-MoSeq results (results.h5)
    source_data:
      file_path:
        type: FilePath
        description: Path to the keypoint-MoSeq ``results.h5``.
      sampling_frequency_hz:
        type: float
        description: Frame rate of the video the keypoints came from, in Hz.
      recording_name:
        type: str | None
        description: Name of the recording group to write.
        optional: true
        default: null
      metadata_key:
        type: str | None
        description: Key of this interface's entries in the ``metadata["Behavior"]["MoseqKeyPoints"]`` registries and in ``metadata["Behavior"]["Ethograms"]``.
        optional: true
        default: null
      verbose:
        type: bool
        description: Controls verbosity of the conversion process.
        optional: true
        default: false
    creates:
    - EthogramBouts and Ethogram (ndx-ethogram)
    - Position > SpatialSeries (centroid)
    - CompassDirection > SpatialSeries (heading)
    - TimeSeries (latent state)
    conversion_options:
      data_to_write:
        type: Literal['algorithm_output', 'ethogram', 'both']
        description: 'Which of the two outputs to write. ``"algorithm_output"`` writes only the per-frame arrays keypoint-MoSeq
          produced: the centroid, the heading and the latent-state trajectory. ``"ethogram"`` writes only the derived ``ndx-ethogram``
          products, and since the latent-state series is then absent from the file the bouts'' ``source`` back-link to it
          is dropped; the ``source_pose`` and ``source_video`` links are external references and are kept. ``"both"`` (the
          default) writes both.'
        optional: true
        default: both
    notes: results.h5 has no time base; sampling_frequency_hz must be supplied
  - name: VameInterface
    module: neuroconv.datainterfaces
    format: VAME behavioral segmentation (.npy + config.yaml)
    source_data:
      file_path:
        type: FilePath
        description: Path to the VAME ``config.yaml`` project file.
      session_name:
        type: str
        description: Session name as it appears in ``config.yaml`` under ``session_names``.
        optional: true
      latent_vectors_file_path:
        type: FilePath | None
        description: Path to the .npy file containing VAME latent-space vectors (2D float32 array of shape ``(n_frames, n_latent_dims)``).
        optional: true
        default: null
      motif_labels_file_paths:
        type: dict | None
        description: Dict mapping a run name to the .npy file containing VAME motif labels (1D int array, one cluster ID per
          video frame).
        optional: true
        default: null
      community_labels_file_paths:
        type: dict | None
        description: Dict mapping a run name to the .npy file containing VAME community labels (1D int array, one community
          ID per video frame).
        optional: true
        default: null
      sampling_frequency_hz:
        type: float | None
        description: Video acquisition rate in Hz (frames per second).
        optional: true
        default: null
      metadata_key:
        type: str
        description: Key of this interface's ``VAMEProject`` entry in ``metadata["Behavior"]["Vame"]["VameProjects"]`` (also
          the prefix of its series keys).
        optional: true
        default: VAMEProject
      verbose:
        type: bool
        description: Controls verbosity of the conversion process.
        optional: true
        default: false
    creates:
    - 'ndx-vame types: motif labels, latent embeddings, community labels'
    conversion_options:
      stub_test:
        type: bool
        description: If ``True``, only the first 100 frames of each data array are written.
        optional: true
        default: false
      data_to_write:
        type: Literal['algorithm_output', 'ethogram', 'both']
        description: Which of the two outputs to write. ``"algorithm_output"`` writes only the ``VAMEProject`` container and
          its faithful ``ndx-vame`` series (motif, community, latent space). ``"ethogram"`` writes only the derived, curated
          ``ndx-ethogram`` products. ``"both"`` (the default) writes both.
        optional: true
        default: both
icephys:
- name: AbfInterface
  module: neuroconv.datainterfaces
  format: Axon Binary Format for intracellular electrophysiology (.abf)
  source_data:
    file_paths:
      type: list[FilePath]
      description: List of files to be converted to the same NWB file.
    icephys_metadata:
      type: dict
      description: Dictionary containing the Icephys-specific metadata.
      optional: true
    icephys_metadata_file_path:
      type: FilePath
      description: JSON file containing the Icephys-specific metadata.
      optional: true
  creates:
  - IntracellularRecordingsTable
  - CurrentClampStimulusSeries / VoltageClampStimulusSeries
  - CurrentClampSeries / VoltageClampSeries
  - Device (Axon Instruments)
  - IntracellularElectrode
  conversion_options:
    icephys_experiment_type:
      type: str
      description: Type of icephys recording.
      optional: true
      default: voltage_clamp
    skip_electrodes:
      type: list[any]
      description: Electrode IDs to skip.
      optional: true
      default: []
- name: AxonIntracellularInterface
  module: neuroconv.datainterfaces
  format: Axon Binary Format intracellular recording (.abf), one electrode
  source_data:
    file_path:
      type: FilePath
      description: Path to the Axon Binary Format (.abf) file.
    response_channel_name:
      type: str
      description: The recorded analog-to-digital converter channel for this electrode's response, given as the channel name
        (for example ``"IN0"`` or ``"_Ipatch"``).
    mode:
      type: Literal['voltage_clamp', 'current_clamp', 'izero']
      description: The clamp mode, which selects the NWB series classes (VoltageClampSeries / CurrentClampSeries / IZeroClampSeries
        and the matching stimulus class).
    stimulus_channel_name:
      type: str | None
      description: A recorded analog-to-digital converter channel name holding the actual delivered stimulus (the amplifier's
        command monitor / secondary output), used as-is.
      optional: true
      default: null
    stimulus_command:
      type: str | None
      description: A digital-to-analog converter command channel name (for example ``"Cmd 0"``) whose waveform is reconstructed
        from the protocol and written as the stimulus.
      optional: true
      default: null
    repetition:
      type: str | None
      description: Label grouping this run's sequential recording with others into a ``Repetitions`` entry (the same protocol
        repeated).
      optional: true
      default: null
    condition:
      type: str | None
      description: Label grouping this run's repetition with others into an ``ExperimentalConditions`` entry.
      optional: true
      default: null
    metadata_key:
      type: str | None
      description: Identity of this interface's response ``PatchClampSeries`` in the metadata dict.
      optional: true
      default: null
    verbose:
      type: bool
      optional: true
      default: false
  creates:
  - PatchClampSeries (and optional stimulus series)
  - IntracellularRecordingsTable rows
  - IntracellularElectrode
  - Device
  conversion_options: {}
  notes: Stops at IntracellularRecordingsTable; higher icephys tables are built once all electrodes are known
- name: BrukerVoltageRecordingInterface
  module: neuroconv.datainterfaces
  format: Bruker PrairieView VoltageRecording (.csv + .xml per cycle), one electrode
  source_data:
    file_paths:
      type: list[FilePath]
      description: The cycle CSV files of one electrode, in acquisition order.
    response_signal_name:
      type: str | None
      description: Which recorded signal is this electrode's response, given as its name in the CSV header and the XML ``SignalList``
        (for example ``"Primary"``).
      optional: true
      default: null
    mode:
      type: Literal['voltage_clamp', 'current_clamp', 'izero'] | None
      description: The clamp mode, which selects the NWB series class.
      optional: true
      default: null
    stimulus_type:
      type: str | None
      description: What kind of run this was, written to the ``stimulus_type`` column and carried up to the sequential recording.
      optional: true
      default: null
    repetition:
      type: str | None
      description: Label grouping this run's sequential recording with others into a ``Repetitions`` entry (the same protocol
        repeated).
      optional: true
      default: null
    condition:
      type: str | None
      description: Label grouping this run's repetition with others into an ``ExperimentalConditions`` entry.
      optional: true
      default: null
    metadata_key:
      type: str | None
      description: Identity of this interface's response ``PatchClampSeries`` in the metadata dict.
      optional: true
      default: null
    verbose:
      type: bool
      optional: true
      default: false
  creates:
  - PatchClampSeries
  - IntracellularRecordingsTable rows
  - IntracellularElectrode
  - Device
  conversion_options: {}
