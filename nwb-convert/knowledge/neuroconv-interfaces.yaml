        type: str | None
        optional: true
        default: null
      iterator_options:
        type: dict | None
        optional: true
        default: null
  - name: SimaSegmentationInterface
    module: neuroconv.datainterfaces
    format: SIMA output (.sima)
    source_data:
      file_path:
        type: FilePath
        description: Path to .sima file
      sima_segmentation_label:
        type: str
        optional: true
        default: auto_ROIs
      metadata_key:
        type: str | None
        description: Metadata key for this interface.
        optional: true
        default: null
    creates:
    - ImageSegmentation (PlaneSegmentation with ROI masks)
    - Fluorescence (RoiResponseSeries)
    - ImagingPlane
    - Device
    conversion_options:
      stub_test:
        type: bool
        description: Only convert a small subset
        optional: true
        default: false
      include_background_segmentation:
        type: bool
        description: Whether to include the background plane segmentation and fluorescence traces in the NWB file.
        optional: true
        default: false
      include_roi_centroids:
        type: bool
        description: Whether to include the ROI centroids on the PlaneSegmentation table.
        optional: true
        default: true
      include_roi_acceptance:
        type: bool | None
        description: Deprecated and ignored.
        optional: true
        default: null
      mask_type:
        type: Literal['image', 'pixel', 'voxel']
        description: There are three types of ROI masks in NWB, 'image', 'pixel', and 'voxel'. * 'image' masks have the same
          shape as the reference images the segmentation was applied to, and weight each pixel by its contribution to the
          ROI (typically boolean, with 0 meaning 'not in the ROI'). * 'pixel' masks are instead indexed by ROI, with the data
          at each index being the shape of the image by the number of pixels in each ROI. * 'voxel' masks are instead indexed
          by ROI, with the data at each index being the shape of the volume by the number of voxels in each ROI.
        optional: true
        default: image
      plane_segmentation_name:
        type: str | None
        description: The name of the plane segmentation to be added.
        optional: true
        default: null
      iterator_options:
        type: dict | None
        description: Options for controlling the iterative write process (buffer size, progress bars) when writing image masks
          and traces.
        optional: true
        default: null
      stub_samples:
        type: int
        description: The number of samples (frames) to use for testing.
        optional: true
        default: 100
      roi_ids_to_add:
        type: list[str | int] | None
        description: The ROI IDs to include in the NWB file.
        optional: true
        default: null
  - name: Suite2pSegmentationInterface
    module: neuroconv.datainterfaces
    format: Suite2p output (.npy files in plane# folders)
    source_data:
      folder_path:
        type: DirectoryPath
        description: Path to the folder containing Suite2p segmentation data.
      channel_name:
        type: str | None
        description: The name of the channel to load.
        optional: true
        default: null
      plane_name:
        type: str | None
        description: The name of the plane to load.
        optional: true
        default: null
      plane_segmentation_name:
        type: str | None
        description: The name of the plane segmentation to be added.
        optional: true
        default: null
      verbose:
        type: bool
        optional: true
        default: false
      metadata_key:
        type: str | None
        description: '# TODO: improve docstring once #1653 (ophys metadata documentation) is merged Metadata key for this
          interface.'
        optional: true
        default: null
    creates:
    - ImageSegmentation (PlaneSegmentation with ROI masks)
    - Fluorescence (RoiResponseSeries)
    - ImagingPlane
    - Device
    conversion_options:
      stub_test:
        type: bool
        description: If True, only a subset of the data (defined by `stub_samples`) will be added for testing purposes, by
          default False.
        optional: true
        default: false
      stub_samples:
        type: int
        description: The number of samples (frames) to include in the subset if `stub_test` is True, by default 100.
        optional: true
        default: 100
      include_roi_centroids:
        type: bool
        description: Whether to include the centroids of regions of interest (ROIs) in the data, by default True.
        optional: true
        default: true
      include_roi_acceptance:
        type: bool | None
        description: Deprecated and ignored.
        optional: true
        default: null
      mask_type:
        type: str | None
        description: There are three types of ROI masks in NWB, 'image', 'pixel', and 'voxel'. * 'image' masks have the same
          shape as the reference images the segmentation was applied to, and weight each pixel by its contribution to the
          ROI (typically boolean, with 0 meaning 'not in the ROI'). * 'pixel' masks are instead indexed by ROI, with the data
          at each index being the shape of the image by the number of pixels in each ROI. * 'voxel' masks are instead indexed
          by ROI, with the data at each index being the shape of the volume by the number of voxels in each ROI.
        optional: true
        default: image
      plane_segmentation_name:
        type: str | None
        optional: true
        default: null
      iterator_options:
        type: dict | None
        description: Additional options for iterating over the data, by default None.
        optional: true
        default: null
  fiber_photometry:
  - name: TDTFiberPhotometryInterface
    module: neuroconv.datainterfaces
    format: TDT fiber photometry (Tbk/Tdx/tev/tin/tsq)
    source_data:
      folder_path:
        type: DirectoryPath
        description: The path to the folder containing the TDT data.
      stream_names:
        type: str | list[str] | None
        description: The input stream(s) (TDT stores) whose samples are assembled into this interface's single ``FiberPhotometryResponseSeries``.
        optional: true
        default: null
      metadata_key:
        type: str | None
        description: Key under ``metadata["FiberPhotometry"]`` holding this interface's response-series metadata.
        optional: true
        default: null
      stream_indices:
        type: list[int] | None
        description: Column indices selecting which channels of the (column-stacked) stream data to keep.
        optional: true
        default: null
      verbose:
        type: bool
        description: Whether to print status messages.
        optional: true
        default: false
    creates:
    - FiberPhotometry (ndx-fiber-photometry)
    - OpticFiber, ExcitationSource, Photodetector (ndx-ophys-devices)
    conversion_options: {}
    notes: Pass stream_names; omitting it uses the deprecated multi-series path. Writes one response series per interface;
      use several interfaces with distinct metadata_key values for several series or for a session split across tanks. For
      TDT epocs (TTLs) use TDTEventsInterface
  - name: DoricFiberPhotometryInterface
    module: neuroconv.datainterfaces
    format: Doric Neuroscience Studio fiber photometry (.doric or .csv)
    source_data:
      file_path:
        type: FilePath
        description: Path to the ``.doric`` HDF5 file or DoricStudio ``.csv`` export.
      stream_names:
        type: str | list[str]
        description: The input stream(s) whose samples are assembled into this interface's single ``FiberPhotometryResponseSeries``.
      metadata_key:
        type: str | None
        description: Key under ``metadata["FiberPhotometry"]`` holding this interface's response-series metadata.
        optional: true
        default: null
      stream_indices:
        type: list[int] | None
        description: Column indices selecting which channels of the (column-stacked) stream data to keep.
        optional: true
        default: null
      verbose:
        type: bool
        description: Whether to print status messages.
        optional: true
        default: false
    creates:
    - FiberPhotometryResponseSeries (ndx-fiber-photometry)
    - FiberPhotometryTable and devices (ndx-ophys-devices)
    conversion_options:
      stub_test:
        type: bool
        description: If True, add only the first ``stub_samples`` samples of each series for testing purposes.
        optional: true
        default: false
      stub_samples:
        type: int
        description: The number of samples to write when ``stub_test`` is True.
        optional: true
        default: 100
      always_write_timestamps:
        type: bool
        description: If True, always write an explicit timestamps array even when the series is regularly sampled.
        optional: true
        default: false
      parent_container:
        type: Literal['acquisition', 'processing/ophys']
        description: The NWBFile container to add the ``FiberPhotometryResponseSeries`` to.
        optional: true
        default: acquisition
    notes: Writes one response series per interface; use several interfaces with distinct metadata_key values for several
      series
  - name: NPMFiberPhotometryInterface
    module: neuroconv.datainterfaces
