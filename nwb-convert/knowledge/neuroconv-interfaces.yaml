      always_write_timestamps:
        type: bool
        description: If True, always write an explicit timestamps array even when the series is regularly sampled.
        optional: true
        default: false
      parent_container:
        type: Literal['acquisition', 'processing/ophys']
        description: The NWBFile container to add the ``FiberPhotometryResponseSeries`` to.
        optional: true
        default: acquisition
  - name: MultiFileCSVFiberPhotometryInterface
    module: neuroconv.datainterfaces
    format: Fiber photometry split across per-channel CSV files
    source_data:
      file_paths:
        type: list[FilePath]
        description: The per-channel CSV files, each contributing its ``data_columns`` as further channels of the single response
          series, in file-then-column order.
      data_columns:
        type: str | int | list[str | int]
        description: The data column(s), read from every file, whose samples are column-stacked into this interface's single
          ``FiberPhotometryResponseSeries``.
      timestamps_column:
        type: str | int
        description: The column holding the timestamps (in ``time_unit``, seconds by default) for the series' time axis, read
          from the first file.
      time_unit:
        type: Literal['seconds', 'milliseconds', 'microseconds']
        description: The unit of ``timestamps_column``; the timestamps are scaled to seconds on read.
        optional: true
