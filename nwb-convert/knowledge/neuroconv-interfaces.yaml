ecephys:
  recordings:
  - name: SpikeGLXRecordingInterface
    module: neuroconv.datainterfaces
    format: SpikeGLX Neuropixels (.ap.bin/.lf.bin + .meta)
    source_data:
      folder_path:
        type: DirectoryPath
        description: Folder path containing the binary files of the SpikeGLX recording.
      stream_id:
        type: str
        description: Stream ID of the SpikeGLX recording.
      verbose:
        type: bool
        description: Whether to output verbose text.
        optional: true
        default: false
      es_key:
        type: str | None
        description: The key to access the metadata of the ElectricalSeries.
        optional: true
        default: null
      metadata_key:
        type: str | None
        description: Key that indexes this interface's entries in the dict-based metadata.
        optional: true
        default: null
    creates:
    - ElectricalSeries
    - Device (Neuropixels)
    - ElectrodeGroup
    - electrodes table
    conversion_options:
      stub_test:
        type: bool
        description: If True, will truncate the data to run the conversion faster and take up less memory.
        optional: true
        default: false
      parent_container:
        type: Literal['acquisition', 'processing/LFP', 'processing/FilteredEphys']
        description: Which NWB container to write the trace data to.
        optional: true
        default: acquisition
      write_as:
        type: Literal['raw', 'lfp', 'processed'] | None
        description: Deprecated.
        optional: true
        default: null
      data_representation:
        type: Literal['digital_counts', 'physical_units']
        description: 'How the trace values are materialized in the stored data array. - ''digital_counts'': store the raw
          integer samples and carry the per-channel gain in ``channel_conversion`` (or a scalar ``conversion`` when homogeneous)
          and the offset in the scalar ``offset``.'
        optional: true
        default: digital_counts
      write_electrical_series:
        type: bool
        description: Electrical series are written in acquisition.
        optional: true
        default: true
      iterator_type:
        type: str | None
        description: 'The type of iterator for chunked data writing. ''v2'': Uses iterative write with control over chunking
          and progress bars.'
        optional: true
        default: v2
      iterator_options:
        type: dict | None
        description: Options for controlling iterative write when iterator_type='v2'.
        optional: true
        default: null
      always_write_timestamps:
        type: bool
        description: Set to True to always write timestamps.
        optional: true
        default: false
