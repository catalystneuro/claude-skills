      metadata_key:
        type: str | None
        description: Key under ``metadata["FiberPhotometry"]`` for this interface's response-series metadata.
        optional: true
        default: null
      read_kwargs:
        type: dict | None
        description: Additional keyword arguments forwarded to ``pandas.read_csv`` to handle format quirks (e.g. ``sep``,
          ``encoding``, ``decimal``).
        optional: true
        default: null
      verbose:
        type: bool
        description: Whether to print status messages.
        optional: true
        default: false
    creates:
    - FiberPhotometryResponseSeries (ndx-fiber-photometry)
    - FiberPhotometryTable and devices (ndx-ophys-devices)
    conversion_options:
      stub_test:
        type: bool
        description: If True, add only the first ``stub_samples`` samples of each series for testing purposes.
        optional: true
        default: false
      stub_samples:
        type: int
        description: The number of samples to write when ``stub_test`` is True.
        optional: true
        default: 100
      always_write_timestamps:
        type: bool
        description: If True, always write an explicit timestamps array even when the series is regularly sampled.
        optional: true
        default: false
      parent_container:
        type: Literal['acquisition', 'processing/ophys']
        description: The NWBFile container to add the ``FiberPhotometryResponseSeries`` to.
        optional: true
        default: acquisition
  - name: PyPhotometryFiberPhotometryInterface
    module: neuroconv.datainterfaces
    format: pyPhotometry recording (.ppd)
    source_data:
      file_path:
