events:
- name: MedPCArrayEventsInterface
  module: neuroconv.datainterfaces
  format: MedPC output (.txt), one array per event type
  source_data:
    file_path:
      type: FilePath
      description: Path to the MedPC file.
    session_header:
      type: dict
      description: The header fields identifying which of the file's sessions to read, keyed by the header line's name ('Start
        Date', 'End Date', 'Subject', 'Experiment', 'Group', 'Box', 'Start Time', 'End Time', 'MSN') and valued as that session
        carries them.
    event_configuration:
      type: dict
      description: The event types of a per-array file, keyed by the MedPC variable holding their onset times (ex. 'A').
    time_unit:
      type: Literal['decaseconds', 'seconds', 'deciseconds', 'centiseconds', 'milliseconds'] | float
      description: What one stored value is worth, default = "seconds".
      optional: true
      default: seconds
    relative_mode:
      type: bool
      description: Whether the program wrote each value as the time since the previous event rather than the time since the
        session began, default = False.
      optional: true
      default: false
    metadata_key:
      type: str | None
      description: The key under ``metadata["Events"]`` that namespaces this interface's events metadata.
      optional: true
      default: null
    verbose:
      type: bool
      description: Whether to print verbose output, by default False.
      optional: true
      default: false
  creates: &id001
  - EventsTable (core pynwb, in nwbfile.events)
  conversion_options: {}
  notes: Replaces MedPCInterface for files where each lettered array holds one event type's onset times
- name: MedPCPackedEventsInterface
  module: neuroconv.datainterfaces
  format: MedPC output (.txt), event type packed into the time value (TIME.EVENTCODE)
  source_data:
    file_path:
      type: FilePath
      description: Path to the MedPC file.
    session_header:
      type: dict
      description: The header fields identifying which of the file's sessions to read, keyed by the header line's name ('Start
        Date', 'End Date', 'Subject', 'Experiment', 'Group', 'Box', 'Start Time', 'End Time', 'MSN') and valued as that session
        carries them.
    events_variable:
      type: str
      description: The MedPC variable holding every event of the session (ex. 'A').
    time_unit:
      type: Literal['decaseconds', 'seconds', 'deciseconds', 'centiseconds', 'milliseconds'] | float
      description: What one stored value is worth, default = "seconds".
      optional: true
      default: seconds
    relative_mode:
      type: bool
      description: Whether the program wrote each value as the time since the previous event rather than the time since the
        session began, default = False.
      optional: true
      default: false
    metadata_key:
      type: str | None
      description: The key under ``metadata["Events"]`` that namespaces this interface's events metadata.
      optional: true
      default: null
    verbose:
      type: bool
      description: Whether to print verbose output, by default False.
      optional: true
      default: false
  creates: *id001
  conversion_options: {}
  notes: Replaces MedPCInterface for files where one array holds every event as TIME.EVENTCODE
- name: TDTEventsInterface
  module: neuroconv.datainterfaces
