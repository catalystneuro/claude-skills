        type: str | None
        description: Key under ``metadata["FiberPhotometry"]`` for this interface's response series.
        optional: true
        default: null
      verbose:
        type: bool
        description: Whether to print status messages.
        optional: true
        default: false
    creates:
    - FiberPhotometryResponseSeries (ndx-fiber-photometry)
    - FiberPhotometryTable and devices (ndx-ophys-devices)
    conversion_options:
