        type: Literal[415, 470, 560]
        description: The excitation LED identifying the one channel this interface reads.
      regions:
        type: str | list[str]
        description: The region column name(s) whose samples are column-stacked into this interface's single ``FiberPhotometryResponseSeries``
          (see :meth:`get_available_regions`).
      timestamps_column:
        type: Literal['Timestamp', 'SystemTimestamp', 'ComputerTimestamp']
        description: The timestamps column to use for the series' time axis.
        optional: true
