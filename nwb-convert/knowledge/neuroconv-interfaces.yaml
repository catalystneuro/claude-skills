    notes: One interface reads one signal; combine several in a converter
  - name: CSVFiberPhotometryInterface
    module: neuroconv.datainterfaces
    format: Generic fiber photometry CSV (one file, timestamps column + data columns)
    source_data:
      file_path:
        type: FilePath
        description: The CSV file holding the fiber photometry data.
      data_columns:
        type: str | int | list[str | int]
        description: The data column(s) whose samples are column-stacked into this interface's single ``FiberPhotometryResponseSeries``.
      timestamps_column:
        type: str | int
        description: The column holding the timestamps (in ``time_unit``, seconds by default) for the series' time axis.
      demux_configuration:
        type: any | None
        description: For an interleaved file (excitation channels multiplexed frame-by-frame down the rows), a configuration
          selecting the one channel this interface reads.
        optional: true
        default: null
      time_unit:
        type: Literal['seconds', 'milliseconds', 'microseconds']
        description: The unit of ``timestamps_column``; the timestamps are scaled to seconds on read.
        optional: true
        default: seconds
      metadata_key:
        type: str | None
        description: Key under ``metadata["FiberPhotometry"]`` holding this interface's response-series metadata.
        optional: true
        default: null
      read_kwargs:
        type: dict | None
        description: Additional keyword arguments forwarded to ``pandas.read_csv`` to handle format quirks such as ``sep``,
          ``encoding``, ``decimal``, or ``skiprows``.
        optional: true
        default: null
      verbose:
        type: bool
        description: Whether to print status messages.
        optional: true
        default: false
    creates:
    - FiberPhotometryResponseSeries (ndx-fiber-photometry)
    - FiberPhotometryTable and devices (ndx-ophys-devices)
    conversion_options:
      stub_test:
        type: bool
        description: If True, add only the first ``stub_samples`` samples of each series for testing purposes.
